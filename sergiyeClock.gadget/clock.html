<html>
<head>
<meta http-equiv="MSThemeCompatible" CONTENT="yes" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Clock</title>
<link href="css/clock.css" rel="stylesheet" type="text/css" />
<script src="js/timeZones.js" language="javascript" type="text/javascript"></script>
<script src="js/settings.js" language="javascript" type="text/javascript"></script>
<script src="js/clock.js" language="javascript" type="text/javascript"></script>
<script language="vbscript" type="text/vbscript">
Function getLocalWeekdayName(dayIndex)
	getLocalWeekdayName = WeekdayName(dayIndex + 1, True, vbSunday)
End Function
</script>
</head>
<body scroll="no" unselectable="on" onload="loadMain()" onmouseover="updateTooltip()">
<img id="clockTime" style="position:absolute;top:-1px;left:-1px;width:1px;height:1px" tabindex="1" />
<g:background id="clockBg" style="position:absolute;width:130px;height:130px;z-index:-1" />
<img id="clockBg_" style="position:absolute;top:0px; left:0px;width:130px;height:130px;-ms-interpolation-mode: nearest-neighbor;" />
<g:image id="highlights" unselectable="on" src="images/spacer_highlights.png" style="position:absolute;left:3px;top:3px;width:124px;height:124px;z-index:30" />
<g:image id="dot" unselectable="on" src="images/black_dot.png" style="position:absolute;left:58px;top:0px;width:13px;height:129px;z-index:23" />
<g:image id="s" unselectable="on" src="images/black_s.png" style="position:absolute;left:58px;top:0px;width:13px;height:129px;z-index:22" />
<g:image id="m" unselectable="on" src="images/black_m.png" style="position:absolute;left:58px;top:0px;width:13px;height:129px;z-index:21" />
<g:image id="h" unselectable="on" src="images/black_h.png" style="position:absolute;left:58px;top:0px;width:13px;height:129px;z-index:20" />
</body>
</html>
